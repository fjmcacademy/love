<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Teaching Board</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root{
      color-scheme:dark;
      --bg:#0d0e11;
      --panel:#090a0d;
      --bar:#17181b;
      --border:#2b2c31;
      --muted:#758095;
      --paper:#fff;
      --rule:#cfdae8;
      --gap:30px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{
      background:var(--bg);color:#e8ebf0;
      font:13px/1.35 Inter,system-ui,Segoe UI,sans-serif;
      height:100vh;overflow:hidden
    }
    button,select,input{font:inherit;color:inherit}
    button{
      background:#121317;border:1px solid #303138;border-radius:6px;
      padding:5px 9px;cursor:pointer;white-space:nowrap
    }
    button:hover{background:#23242a}
    button.active{border-color:#9c7af3;background:#28213a}
    .app{height:100vh;display:flex}
    .sidebar{
      width:205px;min-width:205px;background:var(--panel);
      border-right:1px solid #25262a;padding:9px;overflow:auto;
      scrollbar-width:thin;scrollbar-color:#555 transparent;
      transition:width .18s,min-width .18s,padding .18s
    }
    body.sidebar-hidden .sidebar{
      width:0;min-width:0;padding-left:0;padding-right:0;
      overflow:hidden;border:0
    }
    .brand{font-weight:700;font-size:14px;padding:1px 0 11px}
    .section{font-size:10px;letter-spacing:1px;color:#8591a4;margin:14px 0 7px}
    .themes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
    .themes button{text-align:left;font-size:11px;padding:7px}
    .small{font-size:10px;color:#8390a3;margin:8px 0 4px}
    .range{width:100%;accent-color:#a78bfa}
    .swatchbox{padding:8px;border:1px solid #292a30;border-radius:8px}
    .swatchgrid{display:flex;flex-wrap:wrap;gap:5px}
    .swatch{
      width:23px;height:23px;border:2px solid #454851;padding:0;
      border-radius:50%;flex:none
    }
    .swatch.sel{outline:2px solid white;outline-offset:1px}
    .tool-list{display:grid;gap:3px}
    .tool{
      position:relative;text-align:left;background:transparent;
      border-color:transparent;padding:7px 5px 7px 13px
    }
    .tool:before{
      content:"";position:absolute;left:2px;top:7px;bottom:7px;width:3px;
      background:var(--c);border-radius:3px
    }
    .tool small{display:block;color:#697589;font-size:10px}
    .tool.sel{background:#222329;border-color:#303138}
    .workspace{flex:1;min-width:0;display:flex;flex-direction:column}
    .toolbar,.subbar{
      display:flex;align-items:center;gap:5px;padding:4px 8px;
      background:var(--bar);border-bottom:1px solid #28292e;
      white-space:nowrap;overflow-x:auto;min-height:34px;
      transition:height .18s,min-height .18s,padding .18s
    }
    .toolbar button,.subbar button{font-size:12px;padding:4px 8px}
    body.toolbar-hidden .toolbar{
      min-height:0;height:0;padding-top:0;padding-bottom:0;
      overflow:hidden;border:0
    }
    .spacer{flex:1}
    .subbar{background:#101114;min-height:32px}
    .subbar select{
      background:#17181c;border:1px solid #383940;border-radius:5px;
      padding:4px 7px
    }
    .stage{
      flex:1;overflow:auto;position:relative;padding:60px 30px 45px;
      background:#0d0e11;display:flex;justify-content:center;align-items:flex-start
    }
    #pages{width:100%;display:flex;flex-direction:column;align-items:center}
    .sheet-wrap{
      position:relative;width:min(78vw,850px);min-width:560px;height:1200px;
      background:var(--paper);box-shadow:0 6px 25px #0008;overflow:hidden;
      flex:none
    }
    .sheet{
      position:absolute;inset:0;background-color:var(--paper);
      background-image:repeating-linear-gradient(to bottom,transparent 0,
        transparent calc(var(--gap) - 1px),var(--rule) calc(var(--gap) - 1px),
        var(--rule) var(--gap));
      touch-action:none
    }
    .sheet.blank{background-image:none}
    .sheet.grid{
      background-image:linear-gradient(var(--rule) 1px,transparent 1px),
        linear-gradient(90deg,var(--rule) 1px,transparent 1px);
      background-size:var(--gap) var(--gap)
    }
    .sheet.dotted{
      background-image:radial-gradient(var(--rule) 1px,transparent 1px);
      background-size:var(--gap) var(--gap)
    }
    .sheet canvas{
      position:absolute;inset:0;width:100%;height:100%;touch-action:none
    }
    .sheet canvas.pdf-layer{pointer-events:none}
    .page-tag{
      position:absolute;top:-29px;left:50%;transform:translateX(-50%);
      color:#606b7b;background:#17181c;border-radius:20px;
      padding:4px 11px;font-size:10px
    }
    .palrow{display:flex;gap:5px}
    .palrow .swatch{width:20px;height:20px}
    .camera-float{
      display:none;position:fixed;z-index:10;left:calc(100% - 310px);top:100px;
      width:250px;height:170px;border:2px solid #d8d8dd;background:#090a0c;
      box-shadow:0 6px 25px #0009;touch-action:none;resize:both;
      overflow:hidden;min-width:100px;min-height:70px
    }
    .camera-float.on{display:block}
    .camera-float.circle{border-radius:50%;resize:none}
    .camera-float.square{width:180px;height:180px;resize:both}
    .camera-float.rect{border-radius:8px}
    .camera-float video{width:100%;height:100%;object-fit:cover}
    .camera-float.mirror video{transform:scaleX(-1)}
    .cam-bar{
      position:absolute;top:3px;left:50%;transform:translateX(-50%);
      z-index:2;display:flex;gap:3px;opacity:0;visibility:hidden;
      transition:opacity .15s,visibility .15s
    }
    .camera-float:hover .cam-bar,
    .camera-float:focus-within .cam-bar{opacity:.95;visibility:visible}
    .cam-bar button{font-size:10px;padding:3px 5px;background:#08090ccc}
    .corner{
      position:absolute;width:14px;height:14px;right:0;bottom:0;
      background:#cbd5e1;border:2px solid #111;cursor:nwse-resize;z-index:3
    }
    .modal{
      position:fixed;inset:0;z-index:20;background:#0009;
      display:none;place-items:center
    }
    .modal.open{display:grid}
    .dialog{
      width:min(480px,92vw);background:#17181d;border:1px solid #464851;
      border-radius:12px;padding:18px
    }
    .dialog h3{margin:0 0 10px}
    .dialog p{color:#aab1bf}
    .dialog input,.dialog textarea{
      width:100%;background:#0d0e11;border:1px solid #3c3e46;
      border-radius:6px;padding:8px;margin:5px 0
    }
    .dialog textarea{min-height:100px}
    .row{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
    .toast{
      position:fixed;bottom:12px;left:50%;transform:translateX(-50%);
      z-index:30;background:#22242a;border:1px solid #454750;
      padding:9px 14px;border-radius:8px;display:none
    }
    .toast.show{display:block}
    .view-toggle{
      position:fixed;z-index:8;left:8px;top:8px;
      background:#202127eF;border-color:#51525c;font-size:11px
    }
    #toolbarToggle{left:auto;right:8px}
    @media(max-width:850px){
      .sidebar{width:180px;min-width:180px}
      .sheet-wrap{min-width:500px;width:80vw}
      .toolbar button{font-size:11px;padding:4px 6px}
      .stage{padding-left:16px;padding-right:16px}
    }
    @media print{
      body{overflow:visible;background:#fff}
      .sidebar,.toolbar,.subbar,.view-toggle,.camera-float{display:none!important}
      .stage{overflow:visible;background:white;padding:0}
      .sheet-wrap{width:100%;height:100vh;box-shadow:none;page-break-after:always}
    }
  </style>
</head>
<body>
  <button class="view-toggle" id="sidebarToggle" title="Hide or show left sidebar">☰ Sidebar</button>
  <button class="view-toggle" id="toolbarToggle" title="Hide or show upper toolbar">▤ Toolbar</button>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">Teaching Board</div>

      <div class="section">BOARD</div>
      <div class="themes" id="themes"></div>

      <div class="small">
        Custom board colour
        <input id="boardColor" type="color" value="#ffffff"
          style="float:right;width:30px;height:22px;border:0;background:none">
      </div>
      <div class="small">Line gap <span id="gapVal" style="float:right">30px</span></div>
      <input id="gap" class="range" type="range" min="18" max="60" value="30">

      <div class="section">TOOLS</div>
      <button id="cursor" style="width:100%;text-align:left">
        ⌖ Cursor On <span style="float:right;color:#2c6">●</span>
      </button>

      <div class="section">MARKERS</div>
      <div class="swatchbox">
        <div class="small">Ink colour <span id="hex" style="float:right">#111827</span></div>
        <div class="swatchgrid" id="colors"></div>
        <input id="customInk" type="color" value="#111827"
          style="width:25px;height:24px;padding:0;margin-top:6px;border:0;background:none">
      </div>
      <div class="tool-list" id="tools"></div>
      <div class="small">Size <span id="sizeLabel" style="float:right">3px</span></div>
      <input id="size" class="range" type="range" min="1" max="24" value="3">
      <div class="small">Laser duration <span id="laserLabel" style="float:right">2 sec</span></div>
      <input id="laserDuration" class="range" type="range" min="1" max="15" value="2">
    </aside>

    <main class="workspace">
      <div class="toolbar">
        <button id="undo">← Undo</button>
        <button id="clear" style="color:#fbbf24">Clear</button>
        <button id="camToggle" style="color:#38bdf8">Show Cam</button>
        <button id="openFile" style="color:#fbbf24">Open File</button>
        <button id="files">Files</button>
        <button id="full">Fullscreen</button>
        <button id="comfort">Eye Comfort</button>
        <button id="export" style="color:#38bdf8">Export PDF</button>
        <div class="spacer"></div>
        <div class="palrow" id="topColors"></div>
      </div>

      <div class="subbar">
        <button id="prev">‹</button>
        <span id="pageLabel">Page 1 / 1</span>
        <button id="next">›</button>
        <button id="newPage" style="color:#4ade80">+ New Page</button>
        <div class="spacer"></div>
        <select id="paper">
          <option value="lined">Notebook Lines</option>
          <option value="blank">Plain Board (no lines)</option>
          <option value="grid">Grid</option>
          <option value="dotted">Dots</option>
        </select>
        <button id="minus">−</button>
        <span id="zoomLabel">100%</span>
        <button id="plus">+</button>
        <button id="lock">🔓 Lock</button>
      </div>

      <section class="stage" id="stage"><div id="pages"></div></section>
    </main>
  </div>

  <div class="camera-float rect" id="cameraBox">
    <div class="cam-bar">
      <button id="shape" title="Change camera shape">▭</button>
      <button id="mirror" title="Mirror camera">↔</button>
      <button id="camSmaller" title="Zoom out camera">−</button>
      <button id="camSize" title="Zoom in camera">＋</button>
      <button id="camClose" title="Close camera">×</button>
    </div>
    <video id="cameraVideo" autoplay muted playsinline></video>
    <span class="corner" id="resize"></span>
  </div>

  <div class="modal" id="modal">
    <div class="dialog">
      <h3 id="modalTitle"></h3>
      <div id="modalBody"></div>
      <div class="row" style="justify-content:flex-end">
        <button id="modalClose">Cancel</button>
        <button id="modalOK" class="active">OK</button>
      </div>
    </div>
  </div>

  <input id="fileInput" type="file" accept="image/*,.txt,.md,application/pdf" hidden>
  <div class="toast" id="toast"></div>

  <script>
    (() => {
      'use strict';

      const PAGE_W = 1700;
      const PAGE_H = 2400;
      const colors = [
        '#111827','#4b5563','#fff','#ef4444','#3b82f6','#22c55e',
        '#f97316','#a855f7','#eab308','#ec4899','#06b6d4','#f59e0b'
      ];
      const themeDefs = [
        ['White','#fff','#d8e1ee','lined'],
        ['Lined','#fff','#cad6e5','lined'],
        ['Plain','#fff','#fff','blank'],
        ['Sepia','#f3e7cf','#d9c8a9','lined'],
        ['Dark','#15171c','#343a46','lined'],
        ['Dark Grid','#10131b','#282f40','grid'],
        ['Green','#e9f4e9','#bfd8bf','lined']
      ];
      const toolDefs = [
        ['Laser Pointer','Fading laser','#ff1744'],
        ['Soft Brush','Soft brush effect','#f97316'],
        ['Ink Flow','Smooth ink','#06b6d4'],
        ['Neon Glow','Glowing effect','#ec4899'],
        ['Writing Marker','Broad marker','#f59e0b'],
        ['Auto Smooth','Smooth handwriting','#94a3b8'],
        ['Gel Pen','Gel pen effect','#fb7185'],
        ['Sketch Pen','Pencil-like effect','#fb923c'],
        ['Soft Marker','Soft broad marker','#4ade80'],
        ['Writing Pen','Normal handwriting','#60a5fa'],
        ['Fountain Pen','Fountain pen effect','#e879f9'],
        ['Calligraphy','Calligraphy effect','#facc15'],
        ['Eraser','Erase ink','#6b7280']
      ];

      const $ = (s) => document.querySelector(s);
      let pages = [newPage()];
      let current = 0;
      let ink = '#111827';
      let tool = 'Auto Smooth';
      let size = 3;
      let zoom = 100;
      let locked = false;
      let cursor = false;
      let cameraStream = null;
      let camShape = 0;
      let laserDuration = 2;
      let drawFrame = 0;
      const pdfDocs = new Map();
      const pdfCache = new Map();
      const PDF_CACHE_LIMIT = 3;

      function newPage() {
        return {strokes:[],paper:'lined',bg:'#fff',rule:'#d8e1ee',pdfKey:null,pdfPage:null,pdfImage:null};
      }

      function toast(message) {
        const node = $('#toast');
        node.textContent = message;
        node.classList.add('show');
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => node.classList.remove('show'), 2600);
      }

      function modal(title, html, ok = 'OK', callback) {
        $('#modalTitle').textContent = title;
        $('#modalBody').innerHTML = html;
        $('#modal').classList.add('open');
        $('#modalOK').textContent = ok;
        $('#modalOK').onclick = () => {
          if (callback) callback();
          $('#modal').classList.remove('open');
        };
        $('#modalClose').onclick = () => $('#modal').classList.remove('open');
      }

      function cacheGet(key) {
        if (!pdfCache.has(key)) return null;
        const value = pdfCache.get(key);
        pdfCache.delete(key);
        pdfCache.set(key, value);
        return value;
      }

      function cacheSet(key, canvas) {
        if (pdfCache.has(key)) pdfCache.delete(key);
        pdfCache.set(key, canvas);
        while (pdfCache.size > PDF_CACHE_LIMIT) {
          const oldest = pdfCache.keys().next().value;
          pdfCache.delete(oldest);
        }
      }

      async function renderPdfLayer(page, canvas) {
        if (!page.pdfKey || !page.pdfPage) {
          if (page.pdfImage) {
            const img = new Image();
            img.onload = () => {
              if (canvas.isConnected) {
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0,0,canvas.width,canvas.height);
                ctx.drawImage(img,0,0,canvas.width,canvas.height);
              }
            };
            img.src = page.pdfImage;
          }
          return;
        }

        const doc = pdfDocs.get(page.pdfKey);
        if (!doc) return;

        const displayWidth = canvas.getBoundingClientRect().width || 850;
        const ratio = Math.min(2.5, Math.max(1,
          Math.ceil((displayWidth * (window.devicePixelRatio || 1) / PAGE_W) * 2) / 2));
        const cacheKey = `${page.pdfKey}:${page.pdfPage}:${ratio}`;
        const cached = cacheGet(cacheKey);

        canvas.width = Math.round(PAGE_W * ratio);
        canvas.height = Math.round(PAGE_H * ratio);
        const ctx = canvas.getContext('2d');

        if (cached) {
          ctx.clearRect(0,0,canvas.width,canvas.height);
          ctx.drawImage(cached,0,0,canvas.width,canvas.height);
          return;
        }

        try {
          const pdfPage = await doc.getPage(page.pdfPage);
          const base = pdfPage.getViewport({scale:1});
          const fit = Math.min(PAGE_W / base.width, PAGE_H / base.height);
          const viewport = pdfPage.getViewport({scale:fit * ratio});
          const output = document.createElement('canvas');
          output.width = Math.round(PAGE_W * ratio);
          output.height = Math.round(PAGE_H * ratio);
          const ox = (output.width - viewport.width) / 2;
          const oy = (output.height - viewport.height) / 2;
          const outCtx = output.getContext('2d');
          outCtx.fillStyle = '#fff';
          outCtx.fillRect(0,0,output.width,output.height);
          await pdfPage.render({
            canvasContext:outCtx,
            viewport,
            transform:[1,0,0,1,ox,oy]
          }).promise;

          cacheSet(cacheKey, output);
          if (canvas.isConnected) {
            canvas.width = output.width;
            canvas.height = output.height;
            canvas.getContext('2d').drawImage(output,0,0);
          }
        } catch (error) {
          console.error('PDF render failed:', error);
        }
      }

      const pagesEl = $('#pages');

      function render() {
        pagesEl.innerHTML = '';

        pages.forEach((page, index) => {
          const wrap = document.createElement('div');
          wrap.className = 'sheet-wrap';
          wrap.style.transform = `scale(${zoom / 100})`;
          wrap.style.transformOrigin = 'top center';
          wrap.style.marginBottom = `${1200 * (zoom / 100) - 1200}px`;

          const tag = document.createElement('div');
          tag.className = 'page-tag';
          tag.textContent = `Page ${index + 1}`;

          const sheet = document.createElement('div');
          sheet.className = 'sheet ' +
            (page.paper === 'blank' ? 'blank' :
             page.paper === 'grid' ? 'grid' :
             page.paper === 'dotted' ? 'dotted' : '');
          sheet.style.setProperty('--rule', page.rule || '#d8e1ee');
          sheet.style.setProperty('--gap', $('#gap').value + 'px');
          sheet.style.backgroundColor = page.bg || '#fff';

          const pdfCanvas = document.createElement('canvas');
          pdfCanvas.className = 'pdf-layer';
          pdfCanvas.width = PAGE_W;
          pdfCanvas.height = PAGE_H;
          sheet.appendChild(pdfCanvas);

          const inkCanvas = document.createElement('canvas');
          inkCanvas.width = PAGE_W;
          inkCanvas.height = PAGE_H;
          inkCanvas.dataset.page = index;
          sheet.appendChild(inkCanvas);

          wrap.append(tag,sheet);
          pagesEl.appendChild(wrap);
          renderPdfLayer(page,pdfCanvas);
          draw(index);
          attach(inkCanvas);
        });

        $('#pageLabel').textContent = `Page ${current + 1} / ${pages.length}`;
        $('#paper').value = pages[current].paper;
      }

      function smoothPath(ctx, points) {
        ctx.beginPath();
        ctx.moveTo(points[0].x,points[0].y);
        if (points.length < 3) {
          for (let i=1;i<points.length;i++) ctx.lineTo(points[i].x,points[i].y);
          return;
        }
        for (let i=1;i<points.length-1;i++) {
          const midX = (points[i].x + points[i+1].x) / 2;
          const midY = (points[i].y + points[i+1].y) / 2;
          ctx.quadraticCurveTo(points[i].x,points[i].y,midX,midY);
        }
        const last = points[points.length-1];
        ctx.lineTo(last.x,last.y);
      }

      function draw(i) {
        const canvas = pagesEl.querySelector(`canvas[data-page="${i}"]`);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.setTransform(1,0,0,1,0,0);
        ctx.clearRect(0,0,canvas.width,canvas.height);

        for (const stroke of pages[i].strokes || []) {
          const points = stroke.points;
          if (!points || !points.length) continue;

          const remaining = stroke.tool === 'Laser Pointer'
            ? Math.max(0,(stroke.expiresAt - Date.now()) / (laserDuration * 1000))
            : 1;
          if (stroke.tool === 'Laser Pointer' && remaining <= 0) continue;

          ctx.save();
          ctx.globalCompositeOperation = stroke.tool === 'Eraser' ? 'destination-out' : 'source-over';
          ctx.strokeStyle = stroke.color;
          ctx.fillStyle = stroke.color;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.globalAlpha = 1;
          ctx.shadowBlur = 0;
          ctx.setLineDash([]);

          const width = stroke.width || 3;

          switch (stroke.tool) {
            case 'Laser Pointer':
              ctx.lineWidth = width * 1.5;
              ctx.globalAlpha = .9 * remaining;
              ctx.shadowColor = stroke.color;
              ctx.shadowBlur = 18;
              break;
            case 'Soft Brush':
              ctx.lineWidth = width * 3;
              ctx.globalAlpha = .28;
              ctx.shadowColor = stroke.color;
              ctx.shadowBlur = Math.max(3,width * 1.5);
              break;
            case 'Ink Flow':
              ctx.lineWidth = width * 1.25;
              ctx.shadowColor = stroke.color;
              ctx.shadowBlur = 1;
              break;
            case 'Neon Glow':
              ctx.lineWidth = width * 1.2;
              ctx.shadowColor = stroke.color;
              ctx.shadowBlur = 16;
              break;
            case 'Writing Marker':
            case 'Soft Marker':
              ctx.lineWidth = width * (stroke.tool === 'Soft Marker' ? 2.3 : 2.5);
              ctx.globalAlpha = .48;
              break;
            case 'Gel Pen':
              ctx.lineWidth = width * 1.05;
              ctx.shadowColor = stroke.color;
              ctx.shadowBlur = 2;
              break;
            case 'Sketch Pen':
              ctx.lineWidth = Math.max(1,width * .75);
              ctx.globalAlpha = .72;
              ctx.setLineDash([1.2,1.1]);
              break;
            case 'Fountain Pen':
              ctx.lineWidth = width * 1.25;
              ctx.lineCap = 'square';
              break;
            case 'Calligraphy':
              ctx.lineWidth = width * 2;
              ctx.lineCap = 'square';
              ctx.globalAlpha = .92;
              break;
            case 'Eraser':
              ctx.lineWidth = Math.max(8,width);
              break;
            default:
              ctx.lineWidth = width;
          }

          if (stroke.tool === 'Auto Smooth' || stroke.tool === 'Ink Flow' ||
              stroke.tool === 'Soft Brush' || stroke.tool === 'Gel Pen') {
            smoothPath(ctx,points);
          } else {
            ctx.beginPath();
            ctx.moveTo(points[0].x,points[0].y);
            for (let n=1;n<points.length;n++) ctx.lineTo(points[n].x,points[n].y);
          }

          if (points.length === 1) {
            ctx.lineTo(points[0].x + .1,points[0].y + .1);
          }

          if (stroke.tool === 'Calligraphy' && points.length > 1) {
            const first = points[0], last = points[points.length-1];
            const angle = Math.atan2(last.y-first.y,last.x-first.x);
            ctx.lineWidth = width * (1.2 + Math.abs(Math.sin(angle)) * 1.8);
          }

          ctx.stroke();
          ctx.restore();
        }
      }

      function queueDraw(index) {
        if (drawFrame) return;
        drawFrame = requestAnimationFrame(() => {
          drawFrame = 0;
          draw(index);
        });
      }

      function attach(canvas) {
        let stroke = null;

        function pos(event) {
          const rect = canvas.getBoundingClientRect();
          return {
            x:(event.clientX-rect.left) * PAGE_W / rect.width,
            y:(event.clientY-rect.top) * PAGE_H / rect.height
          };
        }

        canvas.onpointerdown = (event) => {
          if (locked || cursor) return;
          event.preventDefault();
          canvas.setPointerCapture(event.pointerId);
          stroke = {
            color:ink,
            width:tool === 'Eraser' ? Math.max(8,size) : size,
            tool,
            expiresAt:tool === 'Laser Pointer' ? Date.now()+laserDuration*1000 : 0,
            points:[pos(event)]
          };
          pages[+canvas.dataset.page].strokes.push(stroke);
          draw(+canvas.dataset.page);
        };

        canvas.onpointermove = (event) => {
          if (!stroke) return;
          stroke.points.push(pos(event));
          if (stroke.tool === 'Laser Pointer') {
            stroke.expiresAt = Date.now()+laserDuration*1000;
          }
          queueDraw(+canvas.dataset.page);
        };

        canvas.onpointerup = canvas.onpointercancel = () => {
          if (stroke) draw(+canvas.dataset.page);
          stroke = null;
        };
      }

      function setInk(color) {
        ink = color;
        $('#hex').textContent = color.toUpperCase();
        document.querySelectorAll('.swatch').forEach((button) => {
          button.classList.toggle('sel',button.dataset.c === color);
        });
      }

      function buildSwatches(element) {
        colors.forEach((color) => {
          const button = document.createElement('button');
          button.className = 'swatch';
          button.style.background = color;
          button.dataset.c = color;
          button.onclick = () => setInk(color);
          element.appendChild(button);
        });
      }

      buildSwatches($('#colors'));
      buildSwatches($('#topColors'));
      setInk(ink);

      themeDefs.forEach(([name,bg,rule,paper],index) => {
        const button = document.createElement('button');
        button.textContent = name;
        button.className = index === 0 ? 'active' : '';
        button.onclick = () => {
          Object.assign(pages[current],{bg,rule,paper});
          render();
          $('#themes').querySelectorAll('button').forEach((item) => item.classList.remove('active'));
          button.classList.add('active');
        };
        $('#themes').appendChild(button);
      });

      toolDefs.forEach(([name,description,color]) => {
        const button = document.createElement('button');
        button.className = 'tool' + (name === tool ? ' sel' : '');
        button.style.setProperty('--c',color);
        button.innerHTML = `${name}<small>${description}</small>`;
        button.onclick = () => {
          tool = name;
          $('#tools').querySelectorAll('button').forEach((item) => item.classList.remove('sel'));
          button.classList.add('sel');
        };
        $('#tools').appendChild(button);
      });

      $('#customInk').oninput = (event) => setInk(event.target.value);
      $('#size').oninput = (event) => {
        size = +event.target.value;
        $('#sizeLabel').textContent = size + 'px';
      };
      $('#laserDuration').oninput = (event) => {
        laserDuration = +event.target.value;
        $('#laserLabel').textContent = laserDuration + ' sec';
      };
      $('#boardColor').oninput = (event) => {
        pages[current].bg = event.target.value;
        render();
      };
      $('#gap').oninput = (event) => {
        $('#gapVal').textContent = event.target.value + 'px';
        render();
      };
      $('#paper').onchange = (event) => {
        pages[current].paper = event.target.value;
        render();
      };

      $('#undo').onclick = () => {
        pages[current].strokes.pop();
        draw(current);
      };
      $('#clear').onclick = () => modal(
        'Clear page?','<p>Remove all ink from this page?</p>','Clear',() => {
          pages[current].strokes = [];
          draw(current);
        }
      );
      $('#newPage').onclick = () => {
        pages.push(newPage());
        current = pages.length-1;
        render();
      };
      $('#prev').onclick = () => {
        if (current > 0) { current--; render(); }
      };
      $('#next').onclick = () => {
        if (current < pages.length-1) { current++; render(); }
      };

      function setZoom(delta) {
        zoom = Math.max(50,Math.min(200,zoom+delta));
        $('#zoomLabel').textContent = zoom+'%';
        render();
      }
      $('#plus').onclick = () => setZoom(10);
      $('#minus').onclick = () => setZoom(-10);
      $('#lock').onclick = () => {
        locked = !locked;
        $('#lock').textContent = locked ? '🔒 Locked' : '🔓 Lock';
      };
      $('#cursor').onclick = () => {
        cursor = !cursor;
        $('#cursor').classList.toggle('active',cursor);
        $('#cursor').innerHTML = cursor
          ? '⌖ Cursor On <span style="float:right;color:#2c6">●</span>'
          : '⌖ Cursor Off <span style="float:right;color:#f66">●</span>';
        toast(cursor ? 'Cursor mode' : 'Drawing mode');
      };

      $('#sidebarToggle').onclick = () => {
        document.body.classList.toggle('sidebar-hidden');
      };
      $('#toolbarToggle').onclick = () => {
        document.body.classList.toggle('toolbar-hidden');
      };
      $('#full').onclick = () => {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen?.();
      };
      $('#comfort').onclick = () => document.body.classList.toggle('comfort');
      $('#export').onclick = () => window.print();

      async function startCam() {
        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({
            video:{width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30}},
            audio:false
          });
          $('#cameraVideo').srcObject = cameraStream;
          $('#cameraBox').classList.add('on');
          $('#camToggle').textContent = 'Hide Cam';
        } catch {
          toast('Camera permission denied or camera unavailable');
        }
      }

      $('#camToggle').onclick = () => {
        if (cameraStream) {
          cameraStream.getTracks().forEach((track) => track.stop());
          cameraStream = null;
          $('#cameraVideo').srcObject = null;
          $('#cameraBox').classList.remove('on');
          $('#camToggle').textContent = 'Show Cam';
        } else {
          startCam();
        }
      };
      $('#camClose').onclick = () => $('#camToggle').click();
      $('#mirror').onclick = () => $('#cameraBox').classList.toggle('mirror');
      $('#shape').onclick = () => {
        camShape = (camShape+1)%3;
        const box = $('#cameraBox');
        box.classList.remove('circle','square','rect');
        box.classList.add(['rect','circle','square'][camShape]);
        $('#shape').textContent = ['▭','●','□'][camShape];
      };
      $('#camSize').onclick = () => {
        const box = $('#cameraBox');
        box.style.width = (box.offsetWidth+45)+'px';
        box.style.height = (box.offsetHeight+30)+'px';
      };
      $('#camSmaller').onclick = () => {
        const box = $('#cameraBox');
        box.style.width = Math.max(100,box.offsetWidth-45)+'px';
        box.style.height = Math.max(70,box.offsetHeight-30)+'px';
      };

      let moving = false;
      let dx = 0, dy = 0;
      $('#cameraBox').addEventListener('pointerdown',(event) => {
        if (event.target.closest('button') || event.target.id === 'resize') return;
        moving = true;
        const rect = $('#cameraBox').getBoundingClientRect();
        dx = event.clientX-rect.left;
        dy = event.clientY-rect.top;
        $('#cameraBox').setPointerCapture(event.pointerId);
      });
      $('#cameraBox').addEventListener('pointermove',(event) => {
        if (!moving) return;
        const box = $('#cameraBox');
        box.style.left = Math.max(0,Math.min(innerWidth-70,event.clientX-dx))+'px';
        box.style.top = Math.max(0,Math.min(innerHeight-50,event.clientY-dy))+'px';
      });
      $('#cameraBox').addEventListener('pointerup',() => moving = false);
      $('#resize').onpointerdown = (event) => {
        event.stopPropagation();
        event.preventDefault();
        const box = $('#cameraBox');
        const sx=event.clientX, sy=event.clientY;
        const sw=box.offsetWidth, sh=box.offsetHeight;
        const move=(e) => {
          box.style.width=Math.max(100,sw+e.clientX-sx)+'px';
          box.style.height=Math.max(70,sh+e.clientY-sy)+'px';
        };
        const end=() => {
          window.removeEventListener('pointermove',move);
          window.removeEventListener('pointerup',end);
        };
        window.addEventListener('pointermove',move);
        window.addEventListener('pointerup',end);
      };

      $('#openFile').onclick = () => $('#fileInput').click();

      async function openPdf(file) {
        if (!window.pdfjsLib) {
          toast('PDF support did not load.');
          return;
        }
        try {
          pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
          const doc = await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
          const key = `pdf-${Date.now()}-${Math.random().toString(36).slice(2)}`;
          pdfDocs.set(key,doc);
          pages = Array.from({length:doc.numPages},(_,index) => ({
            ...newPage(),paper:'blank',pdfKey:key,pdfPage:index+1
          }));
          current = 0;
          render();
          toast(`PDF opened: ${doc.numPages} page(s)`);
        } catch (error) {
          console.error(error);
          toast('PDF open failed. Try again.');
        }
      }

      $('#fileInput').onchange = async (event) => {
        const file = event.target.files[0];
        if (!file) return;
        const name = file.name.toLowerCase();

        if (file.type === 'application/pdf' || name.endsWith('.pdf')) {
          await openPdf(file);
        } else if (file.type.startsWith('image/')) {
          const image = new Image();
          image.onload = () => {
            const canvas = pagesEl.querySelector(`canvas[data-page="${current}"]`);
            if (canvas) {
              canvas.getContext('2d').drawImage(image,0,0,PAGE_W,PAGE_H);
              toast('Image added to page');
            }
            URL.revokeObjectURL(image.src);
          };
          image.src = URL.createObjectURL(file);
        } else if (name.endsWith('.txt') || name.endsWith('.md') || file.type === 'text/plain') {
          const text = await file.text();
          modal('Open text','<textarea id="fileText"></textarea>','Add',() => {
            const canvas = pagesEl.querySelector(`canvas[data-page="${current}"]`);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = ink;
            ctx.font = '32px sans-serif';
            const lines = ($('#fileText').value || text).slice(0,3000).split('\n');
            lines.forEach((line,index) => ctx.fillText(line,40,70+index*42,1600));
          });
          $('#fileText').value = text;
        }
        event.target.value = '';
      };

      function download(blob,name) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = name;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url),2000);
      }

      $('#files').onclick = () => {
        modal('Board files',`
          <p>Save a portable board copy or open a saved board JSON.</p>
          <div class="row">
            <button id="saveBoard">Download board JSON</button>
            <button id="loadBoard">Open board JSON</button>
            <input id="loadInput" type="file" accept="application/json" hidden>
          </div>`,'Done');

        $('#modalBody').onclick = (event) => {
          if (event.target.id === 'saveBoard') {
            const serializable = pages.map((page) => ({
              ...page,
              pdfKey:null,
              pdfPage:null
            }));
            download(new Blob([JSON.stringify({pages:serializable})],
              {type:'application/json'}),'teaching-board.json');
          }
          if (event.target.id === 'loadBoard') $('#loadInput').click();
        };
        $('#modalBody').onchange = async (event) => {
          if (event.target.id !== 'loadInput' || !event.target.files[0]) return;
          try {
            const data = JSON.parse(await event.target.files[0].text());
            if (!Array.isArray(data.pages)) throw new Error('Invalid board');
            pages = data.pages.map((page) => ({
              ...newPage(),...page,
              pdfKey:null,pdfPage:null,
              strokes:Array.isArray(page.strokes) ? page.strokes : []
            }));
            current = 0;
            render();
            $('#modal').classList.remove('open');
          } catch {
            toast('Invalid board file');
          }
        };
      };

      setInterval(() => {
        const now = Date.now();
        pages.forEach((page,index) => {
          const filtered = page.strokes.filter((stroke) =>
            stroke.tool !== 'Laser Pointer' || stroke.expiresAt > now);
          if (filtered.length !== page.strokes.length) {
            page.strokes = filtered;
            draw(index);
          }
        });
      },150);

      render();
    })();
  </script>
</body>
</html>
