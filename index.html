<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teaching Board</title>
  <style>
    :root {
      --bg: #0d0e11;
      --panel: #090a0d;
      --bar: #17181b;
      --border: #2b2c31;
      --muted: #758095;
      --ink: #111827;
      --paper: #fff;
      --rule: #dfe8f2;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: #e8ebf0;
      font-family: Inter, system-ui, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: min(1100px, 100%);
      height: min(760px, 90vh);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 35px rgba(0,0,0,0.35);
    }

    .board {
      position: absolute;
      inset: 24px 24px 24px 24px;
      background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0));
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .camera-float {
      position: fixed;
      right: 26px;
      top: 30px;
      width: 250px;
      height: 170px;
      border: 2px solid #d8d8dd;
      background: rgba(9, 10, 13, 0.9);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,.3);
      transition: width 0.2s ease, height 0.2s ease;
      z-index: 20;
    }

    .camera-float video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }

    .camera-float:not(.on) video {
      display: none;
    }

    .camera-float .cam-bar {
      position: absolute;
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      background: rgba(8, 9, 12, 0.38);
      border-radius: 999px;
      padding: 4px 8px;
      backdrop-filter: blur(5px);
      opacity: 0.9;
    }

    .cam-bar button {
      border: none;
      background: #0b0f16;
      color: #f5f7fa;
      border-radius: 6px;
      font-size: 13px;
      min-width: 28px;
      height: 28px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .cam-bar button:hover {
      background: #1a2230;
      transform: translateY(-1px);
    }

    .cam-bar #camClose {
      color: #ff8f8f;
    }

    .placeholder {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      color: #a5b0bf;
      font-size: 14px;
      letter-spacing: 0.03em;
      background: linear-gradient(180deg, rgba(9, 10, 13, 0.7), rgba(9, 10, 13, 0.9));
    }

    .camera-float:not(.on) .placeholder {
      display: grid;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="board"></div>

    <div class="camera-float" id="cameraBox">
      <div class="cam-bar">
        <button id="shape" title="Shape">▭</button>
        <button id="mirror" title="Mirror">↔</button>
        <button id="camZoomOut" title="Zoom out">－</button>
        <button id="camSize" title="Zoom in">＋</button>
        <button id="camClose" title="Close">×</button>
      </div>
      <video id="cameraVideo" autoplay muted playsinline></video>
      <div class="placeholder">Camera off</div>
    </div>
  </div>

  <script>
    const cameraBox = document.getElementById('cameraBox');
    const cameraVideo = document.getElementById('cameraVideo');
    const camZoomOut = document.getElementById('camZoomOut');
    const camSize = document.getElementById('camSize');
    const camClose = document.getElementById('camClose');
    const shapeBtn = document.getElementById('shape');
    const mirrorBtn = document.getElementById('mirror');

    let cameraZoom = 1;
    let cameraShape = 'rect';
    let cameraStream = null;

    function updateCameraSize() {
      const width = 250 * cameraZoom;
      const height = 170 * cameraZoom;
      cameraBox.style.width = `${width}px`;
      cameraBox.style.height = `${height}px`;
    }

    function setCameraZoom(delta) {
      cameraZoom = Math.min(2, Math.max(0.6, Number((cameraZoom + delta).toFixed(2))));
      updateCameraSize();
    }

    async function startCamera() {
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        cameraVideo.srcObject = cameraStream;
        cameraBox.classList.add('on');
      } catch (error) {
        console.error('Camera permission denied:', error);
        alert('Camera permission nahi mila. Please allow camera access.');
      }
    }

    function stopCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
      cameraVideo.srcObject = null;
      cameraBox.classList.remove('on');
    }

    function cycleShape() {
      const shapes = ['rect', 'circle', 'square'];
      const i = shapes.indexOf(cameraShape);
      cameraShape = shapes[(i + 1) % shapes.length];
      cameraBox.classList.remove('rect', 'circle', 'square');
      cameraBox.classList.add(cameraShape);
    }

    function toggleMirror() {
      cameraVideo.style.transform = cameraVideo.style.transform === 'scaleX(-1)' ? 'scaleX(1)' : 'scaleX(-1)';
    }

    camZoomOut.addEventListener('click', () => setCameraZoom(-0.2));
    camSize.addEventListener('click', () => setCameraZoom(0.2));
    camClose.addEventListener('click', stopCamera);
    shapeBtn.addEventListener('click', cycleShape);
    mirrorBtn.addEventListener('click', toggleMirror);

    cameraBox.classList.add('rect');
    updateCameraSize();
    startCamera();
  </script>
</body>
</html>
