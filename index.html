<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teaching Board</title>
  <style>
    :root {
      --bg: #0f1116;
      --panel: #121821;
      --bar: #1b2330;
      --muted: #9aa7b5;
      --line: #2f3948;
      --white: #eaf2ff;
      --accent: #6ea8ff;
      --danger: #ff7a7a;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--white);
      font-family: Inter, Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: min(1200px, 100%);
      height: min(760px, 94vh);
      background: linear-gradient(180deg, #111827 0%, #0b1220 100%);
      border: 1px solid var(--line);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0,0,0,0.35);
    }

    .board {
      position: absolute;
      inset: 26px;
      border-radius: 18px;
      background:
        linear-gradient(#ffffff, #ffffff),
        repeating-linear-gradient(
          to bottom,
          #dfe8f7 0px,
          #dfe8f7 1px,
          transparent 1px,
          transparent 26px
        );
      background-blend-mode: normal;
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: inset 0 0 0 12px rgba(255,255,255,.03);
    }

    .camera-float {
      position: fixed;
      right: 28px;
      top: 30px;
      width: 250px;
      height: 170px;
      background: rgba(8, 12, 18, 0.94);
      border: 2px solid rgba(255,255,255,0.18);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
      z-index: 20;
      transition: width 0.18s ease, height 0.18s ease;
    }

    .camera-float video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }

    .camera-float .cam-bar {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(6px);
      z-index: 2;
    }

    .cam-bar button {
      border: none;
      background: rgba(255,255,255,0.06);
      color: white;
      border-radius: 7px;
      width: 32px;
      height: 30px;
      font-size: 17px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .cam-bar button:hover {
      background: rgba(255,255,255,0.12);
      transform: translateY(-1px);
    }

    #camClose {
      color: var(--danger);
    }

    .placeholder {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 13px;
      color: var(--muted);
      background: rgba(0,0,0,0.2);
      letter-spacing: 0.04em;
    }

    .camera-float:not(.on) .placeholder {
      display: grid;
    }

    .camera-float.on .placeholder {
      display: none;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="board"></div>

    <div class="camera-float" id="cameraBox">
      <div class="cam-bar">
        <button id="shape" title="Shape">▭</button>
        <button id="mirror" title="Mirror">↔</button>
        <button id="camZoomOut" title="Zoom out">－</button>
        <button id="camSize" title="Zoom in">＋</button>
        <button id="camClose" title="Close">×</button>
      </div>
      <video id="cameraVideo" autoplay muted playsinline></video>
      <div class="placeholder">Camera off</div>
    </div>
  </div>

  <script>
    const cameraBox = document.getElementById('cameraBox');
    const cameraVideo = document.getElementById('cameraVideo');
    const camZoomOut = document.getElementById('camZoomOut');
    const camSize = document.getElementById('camSize');
    const camClose = document.getElementById('camClose');
    const shapeBtn = document.getElementById('shape');
    const mirrorBtn = document.getElementById('mirror');

    let cameraZoom = 1;
    let stream = null;
    let shapeMode = 'rect';

    function updateCameraSize() {
      const width = 250 * cameraZoom;
      const height = 170 * cameraZoom;
      cameraBox.style.width = width + 'px';
      cameraBox.style.height = height + 'px';
    }

    function setCameraZoom(delta) {
      cameraZoom = Math.min(2, Math.max(0.6, Number((cameraZoom + delta).toFixed(2))));
      updateCameraSize();
    }

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        cameraVideo.srcObject = stream;
        cameraBox.classList.add('on');
      } catch (error) {
        alert('Camera permission required.');
        console.error(error);
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      cameraVideo.srcObject = null;
      cameraBox.classList.remove('on');
    }

    function toggleShape() {
      const modes = ['rect', 'circle', 'square'];
      const currentIndex = modes.indexOf(shapeMode);
      shapeMode = modes[(currentIndex + 1) % modes.length];
      cameraBox.style.borderRadius = shapeMode === 'circle' ? '50%' : (shapeMode === 'square' ? '0px' : '12px');
    }

    function toggleMirror() {
      cameraVideo.style.transform = cameraVideo.style.transform === 'scaleX(-1)' ? 'scaleX(1)' : 'scaleX(-1)';
    }

    camZoomOut.addEventListener('click', () => setCameraZoom(-0.2));
    camSize.addEventListener('click', () => setCameraZoom(0.2));
    camClose.addEventListener('click', stopCamera);
    shapeBtn.addEventListener('click', toggleShape);
    mirrorBtn.addEventListener('click', toggleMirror);

    updateCameraSize();
    startCamera();
  </script>
</body>
</html>
