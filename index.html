<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Teaching Board</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#0d0e11;--panel:#090a0d;--bar:#17181b;--rule:#d8e1ee;--gap:30px}
    *{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:#e8ebf0;font:13px/1.4 system-ui,Segoe UI,sans-serif;overflow:hidden}
    button,input,select{font:inherit;color:inherit}button{background:#121317;border:1px solid #303138;border-radius:6px;padding:6px 9px;cursor:pointer;white-space:nowrap}button:hover{background:#25262c}button:disabled{opacity:.45;cursor:not-allowed}
    .app{height:100vh;display:flex}.sidebar{width:205px;min-width:205px;background:var(--panel);border-right:1px solid #25262a;padding:10px;overflow:auto}.workspace{flex:1;min-width:0;display:flex;flex-direction:column}.brand{font-weight:700;font-size:15px;margin-bottom:15px}.section{font-size:10px;letter-spacing:1px;color:#8591a4;margin:14px 0 7px}.small{font-size:11px;color:#9aa3b0;margin:8px 0 4px}.range{width:100%;accent-color:#a78bfa}.swatches{display:flex;flex-wrap:wrap;gap:5px}.swatch{width:22px;height:22px;padding:0;border-radius:50%;border:2px solid #555}.swatch.sel{outline:2px solid white;outline-offset:1px}.tool-list{display:grid;gap:3px}.tool{text-align:left;background:transparent;border-color:transparent;padding:7px}.tool.sel{background:#28213a;border-color:#9c7af3}.tool small{display:block;color:#9aa3b0;font-size:10px}.toolbar,.subbar{display:flex;align-items:center;gap:5px;padding:5px 8px;background:var(--bar);border-bottom:1px solid #28292e;white-space:nowrap;overflow-x:auto;min-height:36px}.subbar{background:#101114;min-height:36px}.spacer{flex:1}.subbar select{background:#17181c;border:1px solid #383940;border-radius:5px;padding:5px}.stage{flex:1;min-height:0;overflow:auto;position:relative;padding:60px 30px 45px;display:flex;justify-content:center;align-items:flex-start}#pages{width:100%;display:flex;flex-direction:column;align-items:center}.sheet-wrap{position:relative;width:min(78vw,850px);min-width:500px;height:1200px;background:#fff;box-shadow:0 6px 25px #0008;overflow:visible;flex:none;transform-origin:top center}.sheet{position:absolute;inset:0;overflow:hidden;touch-action:none;background-color:var(--paper,#fff);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--gap) - 1px),var(--rule) calc(var(--gap) - 1px),var(--rule) var(--gap))}.sheet.blank{background-image:none}.sheet.grid{background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);background-size:var(--gap) var(--gap)}.sheet.dotted{background-image:radial-gradient(var(--rule) 1px,transparent 1px);background-size:var(--gap) var(--gap)}.sheet canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.sheet canvas.background{z-index:0;pointer-events:none}.sheet canvas.ink{z-index:1;pointer-events:auto}.page-tag{position:absolute;top:-29px;left:50%;transform:translateX(-50%);color:#aab1bf;background:#17181c;border-radius:20px;padding:4px 11px;font-size:10px;white-space:nowrap}.camera{display:none;position:fixed;z-index:10;right:24px;top:80px;width:240px;height:160px;background:#000;border:2px solid #ddd;overflow:hidden;resize:both;min-width:100px;min-height:70px}.camera.on{display:block}.camera video{width:100%;height:100%;object-fit:cover}.toast{position:fixed;z-index:30;bottom:15px;left:50%;transform:translateX(-50%);background:#24262d;padding:9px 14px;border:1px solid #454750;border-radius:8px;display:none}.toast.show{display:block}.status{color:#4ade80}.help{font-size:10px;color:#9aa3b0;line-height:1.5}.danger{color:#fca5a5!important}@media(max-width:850px){.sidebar{width:175px;min-width:175px}.sheet-wrap{width:80vw;min-width:480px}.stage{padding-left:12px;padding-right:12px}}@media print{body{overflow:visible;background:#fff}.sidebar,.toolbar,.subbar,.camera{display:none!important}.stage{overflow:visible;padding:0;background:#fff}.sheet-wrap{width:100%;height:100vh;box-shadow:none;page-break-after:always;transform:none!important;margin:0!important}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">Teaching Board</div>
      <div class="section">BOARD</div>
      <div id="themes" class="swatches"></div>
      <label class="small">Custom board colour <input id="boardColor" type="color" value="#ffffff" style="float:right"></label>
      <label class="small">Line gap <span id="gapValue">30px</span><input id="gap" class="range" type="range" min="18" max="60" value="30"></label>
      <div class="section">MARKERS</div>
      <div id="colors" class="swatches"></div>
      <input id="customInk" type="color" value="#111827" title="Custom ink colour">
      <div id="tools" class="tool-list" style="margin-top:8px"></div>
      <label class="small">Size <span id="sizeValue">4px</span><input id="size" class="range" type="range" min="1" max="30" value="4"></label>
      <div class="section">SAVE & RECORD</div>
      <p class="help">Your board and imported PDFs/images are saved in this browser automatically (IndexedDB). They remain here after refresh; clearing browser site data removes them.</p>
      <button id="record" style="width:100%">🔴 Record Board</button>
      <div id="status" class="small status">● Ready</div>
    </aside>
    <main class="workspace">
      <div class="toolbar">
        <button id="undo">← Undo</button><button id="clear">Clear ink</button><button id="openFile">Open PDF / image</button><button id="deletePage" class="danger">Delete page</button><button id="cameraToggle">Show camera</button><button id="export">Print / export</button>
        <div class="spacer"></div><span id="saved" class="small">Saved locally</span>
      </div>
      <div class="subbar">
        <button id="prev">‹</button><span id="pageLabel">Page 1 / 1</span><button id="next">›</button><button id="newPage">＋ New page</button><div class="spacer"></div>
        <select id="paper"><option value="lined">Notebook lines</option><option value="blank">Plain board</option><option value="grid">Grid</option><option value="dotted">Dots</option></select>
        <button id="minus">−</button><span id="zoomLabel">100%</span><button id="plus">＋</button>
      </div>
      <section id="stage" class="stage"><div id="pages"></div></section>
    </main>
  </div>
  <div id="camera" class="camera"><video id="cameraVideo" autoplay muted playsinline></video></div>
  <input id="fileInput" type="file" accept="image/*,.pdf,application/pdf" hidden>
  <div id="toast" class="toast"></div>
<script>
(() => {
  'use strict';
  const PAGE_W=1700, PAGE_H=2400, DB_NAME='teaching-board-v2', DB_VERSION=1;
  const $=s=>document.querySelector(s);
  const toolDefs=[['Writing Pen','Smooth everyday pen'],['Writing Marker','Broad marker'],['Soft Brush','Soft brush'],['Neon Glow','Glow pen'],['Laser Pointer','Fading laser'],['Eraser','Erase ink']];
  const palette=['#111827','#4b5563','#ffffff','#ef4444','#3b82f6','#22c55e','#f97316','#a855f7','#eab308','#ec4899','#06b6d4'];
  const themes=[['White','#ffffff','#d8e1ee','lined'],['Sepia','#f3e7cf','#d9c8a9','lined'],['Plain','#ffffff','#ffffff','blank'],['Dark','#15171c','#343a46','lined'],['Green','#e9f4e9','#bfd8bf','lined']];
  const makePage=()=>({id:crypto.randomUUID?.()||String(Date.now()+Math.random()),strokes:[],paper:'lined',bg:'#ffffff',rule:'#d8e1ee',assetId:null,assetType:null,pdfPage:null});
  let pages=[makePage()],current=0,ink='#111827',tool='Writing Pen',size=4,zoom=100,db=null,drawFrame=0,recording=false,recorder=null,recordingStream=null,cameraStream=null;
  const pdfDocs=new Map(), renderJobs=new Map();
  function toast(text){const n=$('#toast');n.textContent=text;n.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>n.classList.remove('show'),3000)}
  function openDB(){return new Promise((resolve,reject)=>{const request=indexedDB.open(DB_NAME,DB_VERSION);request.onupgradeneeded=()=>{const d=request.result;if(!d.objectStoreNames.contains('assets'))d.createObjectStore('assets');if(!d.objectStoreNames.contains('state'))d.createObjectStore('state')};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}
  function dbRequest(store,mode,operation){return new Promise((resolve,reject)=>{const tx=db.transaction(store,mode),request=operation(tx.objectStore(store));request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}
  let saveTimer;
  function scheduleSave(){clearTimeout(saveTimer);$('#saved').textContent='Saving…';saveTimer=setTimeout(saveState,350)}
  async function saveState(){if(!db)return;try{await dbRequest('state','readwrite',s=>s.put({pages,current,ink,tool,size,zoom,gap:$('#gap').value},'board'));$('#saved').textContent='Saved locally'}catch(e){console.error(e);$('#saved').textContent='Save failed';toast('Could not save board storage')}}
  async function putAsset(blob){const id='asset-'+(crypto.randomUUID?.()||Date.now()+'-'+Math.random());await dbRequest('assets','readwrite',s=>s.put(blob,id));return id}
  async function getAsset(id){return id?dbRequest('assets','readonly',s=>s.get(id)):null}
  async function removeUnusedAssets(){if(!db)return;const referenced=new Set(pages.map(p=>p.assetId).filter(Boolean));const keys=await dbRequest('assets','readonly',s=>s.getAllKeys());for(const key of keys)if(!referenced.has(key))await dbRequest('assets','readwrite',s=>s.delete(key));pdfDocs.clear()}
  function normalizePage(p){return {...makePage(),...p,strokes:Array.isArray(p?.strokes)?p.strokes:[]}}
  async function restore(){try{db=await openDB();const state=await dbRequest('state','readonly',s=>s.get('board'));if(state&&Array.isArray(state.pages)&&state.pages.length){pages=state.pages.map(normalizePage);current=Math.max(0,Math.min(state.current||0,pages.length-1));ink=state.ink||ink;tool=state.tool||tool;size=state.size||size;zoom=state.zoom||zoom;if(state.gap)$('#gap').value=state.gap;$('#size').value=size;$('#sizeValue').textContent=size+'px';$('#zoomLabel').textContent=zoom+'%';$('#customInk').value=ink;$('#boardColor').value=pages[current].bg||'#ffffff';$('#gapValue').textContent=$('#gap').value+'px'}render();$('#saved').textContent='Saved locally'}catch(e){console.error(e);toast('Local storage unavailable; changes may not survive refresh');render()}}
  function buildControls(){for(const [name,bg,rule,paper] of themes){const b=document.createElement('button');b.textContent=name;b.title='Apply '+name+' board';b.onclick=()=>{Object.assign(pages[current],{bg,rule,paper});$('#boardColor').value=bg;$('#paper').value=paper;render();scheduleSave()};$('#themes').appendChild(b)}for(const c of palette){const b=document.createElement('button');b.className='swatch';b.style.background=c;b.title=c;b.onclick=()=>setInk(c);$('#colors').appendChild(b)}for(const [name,description] of toolDefs){const b=document.createElement('button');b.className='tool';b.innerHTML=`${name}<small>${description}</small>`;b.onclick=()=>{tool=name;document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('sel',x===b));scheduleSave()};if(name===tool)b.classList.add('sel');$('#tools').appendChild(b)}}
  function setInk(c){ink=c;$('#customInk').value=c;document.querySelectorAll('.swatch').forEach(b=>b.classList.toggle('sel',b.title===c));scheduleSave()}
  async function drawBackground(pageIndex,canvas){const page=pages[pageIndex];if(!page||!canvas)return;const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);const job=(renderJobs.get(pageIndex)||0)+1;renderJobs.set(pageIndex,job);if(!page.assetId)return;try{const blob=await getAsset(page.assetId);if(!blob||renderJobs.get(pageIndex)!==job)return;if(page.assetType==='pdf'){if(!window.pdfjsLib)throw Error('PDF.js unavailable');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';let doc=pdfDocs.get(page.assetId);if(!doc){doc=await pdfjsLib.getDocument({data:await blob.arrayBuffer()}).promise;pdfDocs.set(page.assetId,doc)}const pdfPage=await doc.getPage(page.pdfPage||1);const base=pdfPage.getViewport({scale:1});const scale=Math.min(PAGE_W/base.width,PAGE_H/base.height);const viewport=pdfPage.getViewport({scale});const off=document.createElement('canvas');off.width=PAGE_W;off.height=PAGE_H;const c=off.getContext('2d');c.fillStyle=page.bg||'#fff';c.fillRect(0,0,PAGE_W,PAGE_H);await pdfPage.render({canvasContext:c,viewport,transform:[1,0,0,1,(PAGE_W-viewport.width)/2,(PAGE_H-viewport.height)/2]}).promise;if(renderJobs.get(pageIndex)===job)ctx.drawImage(off,0,0)}else{const url=URL.createObjectURL(blob);try{const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=url});if(renderJobs.get(pageIndex)===job)ctx.drawImage(image,0,0,PAGE_W,PAGE_H)}finally{URL.revokeObjectURL(url)}}}catch(e){console.error(e);toast('File render failed: '+e.message)}}
  function render(){const root=$('#pages');root.innerHTML='';pages.forEach((page,i)=>{const wrap=document.createElement('div');wrap.className='sheet-wrap';wrap.style.transform=`scale(${zoom/100})`;wrap.style.marginBottom=`${1200*(zoom/100)-1200}px`;const tag=document.createElement('div');tag.className='page-tag';tag.textContent=`Page ${i+1}${page.assetType==='pdf'?' · PDF':''}`;const sheet=document.createElement('div');sheet.className='sheet '+(page.paper==='blank'?'blank':page.paper==='grid'?'grid':page.paper==='dotted'?'dotted':'');sheet.style.setProperty('--rule',page.rule||'#d8e1ee');sheet.style.setProperty('--gap',$('#gap').value+'px');sheet.style.setProperty('--paper',page.bg||'#fff');const bg=document.createElement('canvas');bg.className='background';bg.width=PAGE_W;bg.height=PAGE_H;const inkCanvas=document.createElement('canvas');inkCanvas.className='ink';inkCanvas.width=PAGE_W;inkCanvas.height=PAGE_H;inkCanvas.dataset.page=i;sheet.append(bg,inkCanvas);wrap.append(tag,sheet);root.appendChild(wrap);drawBackground(i,bg);draw(i);attach(inkCanvas)});$('#pageLabel').textContent=`Page ${current+1} / ${pages.length}`;$('#paper').value=pages[current].paper;$('#boardColor').value=pages[current].bg||'#ffffff';$('#prev').disabled=current===0;$('#next').disabled=current===pages.length-1}
  function drawSmooth(ctx,points){ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);if(points.length===1){ctx.lineTo(points[0].x+.1,points[0].y+.1);return}for(let i=1;i<points.length;i++){const p=points[i],prev=points[i-1];const mx=(prev.x+p.x)/2,my=(prev.y+p.y)/2;if(i===1)ctx.lineTo(mx,my);else ctx.quadraticCurveTo(prev.x,prev.y,mx,my)}const last=points.at(-1);ctx.lineTo(last.x,last.y)}
  function draw(i){const c=document.querySelector(`canvas.ink[data-page="${i}"]`);if(!c||!pages[i])return;const ctx=c.getContext('2d');ctx.clearRect(0,0,PAGE_W,PAGE_H);for(const s of pages[i].strokes){if(!s.points?.length)continue;const remain=s.tool==='Laser Pointer'?Math.max(0,(s.expiresAt-Date.now())/Math.max(1,s.duration||2000)):1;if(s.tool==='Laser Pointer'&&remain<=0)continue;ctx.save();ctx.globalCompositeOperation=s.tool==='Eraser'?'destination-out':'source-over';ctx.strokeStyle=s.color||'#111827';ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=(s.width||4)*(s.tool==='Writing Marker'?2.4:s.tool==='Soft Brush'?2.5:1);ctx.globalAlpha=s.tool==='Laser Pointer'?remain:s.tool==='Soft Brush'?.35:1;ctx.shadowColor=s.color||'#111827';ctx.shadowBlur=s.tool==='Neon Glow'?14:s.tool==='Soft Brush'?Math.max(3,s.width):0;drawSmooth(ctx,s.points);ctx.stroke();ctx.restore()}}
  function attach(canvas){let stroke=null;const point=e=>{const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*PAGE_W/r.width,y:(e.clientY-r.top)*PAGE_H/r.height}};canvas.onpointerdown=e=>{if(e.button!==undefined&&e.button!==0)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);stroke={color:ink,width:size,tool,expiresAt:tool==='Laser Pointer'?Date.now()+2000:0,duration:2000,points:[point(e)]};pages[+canvas.dataset.page].strokes.push(stroke);draw(+canvas.dataset.page);scheduleSave()};canvas.onpointermove=e=>{if(!stroke)return;stroke.points.push(point(e));if(stroke.tool==='Laser Pointer')stroke.expiresAt=Date.now()+2000;if(drawFrame)cancelAnimationFrame(drawFrame);drawFrame=requestAnimationFrame(()=>{drawFrame=0;draw(+canvas.dataset.page)});scheduleSave()};const finish=()=>{if(stroke){draw(+canvas.dataset.page);stroke=null;scheduleSave()}};canvas.onpointerup=finish;canvas.onpointercancel=finish}
  function pageChanged(){render();scheduleSave()}
  $('#customInk').oninput=e=>setInk(e.target.value);$('#size').oninput=e=>{size=+e.target.value;$('#sizeValue').textContent=size+'px';scheduleSave()};$('#gap').oninput=e=>{ $('#gapValue').textContent=e.target.value+'px';render();scheduleSave()};$('#boardColor').oninput=e=>{pages[current].bg=e.target.value;pageChanged()};$('#paper').onchange=e=>{pages[current].paper=e.target.value;pageChanged()};
  $('#undo').onclick=()=>{pages[current].strokes.pop();draw(current);scheduleSave()};$('#clear').onclick=()=>{pages[current].strokes=[];draw(current);scheduleSave()};$('#newPage').onclick=()=>{pages.splice(current+1,0,makePage());current++;pageChanged()};$('#prev').onclick=()=>{if(current>0){current--;pageChanged()}};$('#next').onclick=()=>{if(current<pages.length-1){current++;pageChanged()}};$('#deletePage').onclick=async()=>{if(pages.length===1){pages[0]=makePage();current=0}else{pages.splice(current,1);current=Math.min(current,pages.length-1)}await removeUnusedAssets();pageChanged();toast('Page deleted')};
  function setZoom(delta){zoom=Math.max(50,Math.min(200,zoom+delta));$('#zoomLabel').textContent=zoom+'%';render();scheduleSave()}$('#plus').onclick=()=>setZoom(10);$('#minus').onclick=()=>setZoom(-10);$('#export').onclick=()=>window.print();
  $('#openFile').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{const id=await putAsset(file);if(file.type==='application/pdf'||file.name.toLowerCase().endsWith('.pdf')){if(!window.pdfjsLib)throw Error('PDF reader could not load');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;pdfDocs.set(id,doc);const pdfPages=Array.from({length:doc.numPages},(_,n)=>({...makePage(),paper:'blank',assetId:id,assetType:'pdf',pdfPage:n+1}));pages.splice(current,1,...pdfPages);current=Math.min(current,pages.length-1);toast(`PDF opened (${doc.numPages} pages)`)}else if(file.type.startsWith('image/')){pages[current].assetId=id;pages[current].assetType='image';pages[current].paper='blank';toast('Image opened on current page')}else{await dbRequest('assets','readwrite',s=>s.delete(id));throw Error('Choose a PDF or image file')}pageChanged()}catch(err){console.error(err);toast('Could not open file: '+err.message)}};
  async function startCamera(){try{cameraStream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});$('#cameraVideo').srcObject=cameraStream;$('#camera').classList.add('on');$('#cameraToggle').textContent='Hide camera'}catch{toast('Camera permission denied or camera unavailable')}}function stopCamera(){cameraStream?.getTracks().forEach(t=>t.stop());cameraStream=null;$('#cameraVideo').srcObject=null;$('#camera').classList.remove('on');$('#cameraToggle').textContent='Show camera'}$('#cameraToggle').onclick=()=>$('#camera').classList.contains('on')?stopCamera():startCamera();
  function makeRecordingCanvas(){const c=document.createElement('canvas');c.width=1920;c.height=1080;const ctx=c.getContext('2d');let active=true,raf;const frame=()=>{if(!active)return;ctx.fillStyle='#111';ctx.fillRect(0,0,c.width,c.height);const page=pages[current],bg=document.querySelector(`canvas.background`),inkCanvas=document.querySelector(`canvas.ink[data-page="${current}"]`);const base=Math.min(c.width/PAGE_W,c.height/PAGE_H);const destW=PAGE_W*base,destH=PAGE_H*base,scale=zoom/100,srcW=PAGE_W/scale,srcH=PAGE_H/scale,sx=(PAGE_W-srcW)/2,sy=(PAGE_H-srcH)/2,dx=(c.width-destW)/2,dy=(c.height-destH)/2;if(page){ctx.fillStyle=page.bg||'#fff';ctx.fillRect(dx,dy,destW,destH);if(bg)ctx.drawImage(bg,sx,sy,srcW,srcH,dx,dy,destW,destH);if(inkCanvas)ctx.drawImage(inkCanvas,sx,sy,srcW,srcH,dx,dy,destW,destH)}const video=$('#cameraVideo');if($('#camera').classList.contains('on')&&video.readyState>=2){ctx.save();ctx.fillStyle='#000';ctx.fillRect(1480,30,400,260);ctx.drawImage(video,1480,30,400,260);ctx.restore()}raf=requestAnimationFrame(frame)};frame();const stream=c.captureStream(30);return{stream,stop(){active=false;cancelAnimationFrame(raf);stream.getTracks().forEach(t=>t.stop())}}}
  let composite=null;$('#record').onclick=async()=>{if(recording){recorder?.stop();return}try{composite=makeRecordingCanvas();recordingStream=composite.stream;const options={};if(MediaRecorder.isTypeSupported('video/webm;codecs=vp9'))options.mimeType='video/webm;codecs=vp9';else if(MediaRecorder.isTypeSupported('video/webm;codecs=vp8'))options.mimeType='video/webm;codecs=vp8';recorder=new MediaRecorder(recordingStream,options);const chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const url=URL.createObjectURL(new Blob(chunks,{type:recorder.mimeType||'video/webm'}));const a=document.createElement('a');a.href=url;a.download='teaching-board-recording.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);composite?.stop();composite=null;recordingStream=null;recording=false;$('#record').textContent='🔴 Record Board';$('#status').textContent='● Ready';toast('Recording downloaded')};recorder.start();recording=true;$('#record').textContent='■ Stop recording';$('#status').textContent='● Recording'}catch(e){console.error(e);composite?.stop();toast('Recording is not supported in this browser')}};
  setInterval(()=>{let changed=false;for(let i=0;i<pages.length;i++){const before=pages[i].strokes.length;pages[i].strokes=pages[i].strokes.filter(s=>s.tool!=='Laser Pointer'||s.expiresAt>Date.now());if(before!==pages[i].strokes.length){draw(i);changed=true}}if(changed)scheduleSave()},250);
  buildControls();restore();
})();
</script>
</body>
</html>
