<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teaching Board</title>
<style>
:root{color-scheme:dark;--bg:#101116;--panel:#171920;--line:#30333d;--text:#eef0f6;--muted:#a3a9ba;--accent:#8b7bff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;height:100vh;overflow:hidden}button,select,input{font:inherit;color:inherit}button,select{background:#242731;border:1px solid var(--line);border-radius:7px;padding:8px 11px}button{cursor:pointer}button:hover{background:#303440}button.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.app{height:100vh;display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}.brand{font-weight:750;margin:0 12px 0 2px}.spacer{flex:1}.top label,.settings label{display:flex;align-items:center;gap:7px;color:var(--muted)}input[type=color]{width:34px;height:30px;padding:2px;border:1px solid var(--line);background:transparent;border-radius:6px}input[type=range]{width:110px;accent-color:var(--accent)}.boardarea{flex:1;min-height:0;display:flex;flex-direction:column}.subbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#13151a;border-bottom:1px solid var(--line)}.stage{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:34px 20px;background:#0d0e12}.pages{display:flex;flex-direction:column;gap:24px;align-items:center}.sheet{position:relative;width:min(850px,78vw);aspect-ratio:850/1200;background:white;box-shadow:0 8px 28px #0009;overflow:hidden;touch-action:none}.sheet.blank{background:#fff}.sheet.lined{background-color:#fff;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 29px,#cbd5e1 30px)}.sheet.grid{background-color:#fff;background-image:linear-gradient(#d5dbe5 1px,transparent 1px),linear-gradient(90deg,#d5dbe5 1px,transparent 1px);background-size:30px 30px}.sheet.dotted{background-color:#fff;background-image:radial-gradient(#bac4d2 1px,transparent 1px);background-size:24px 24px}.sheet canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.sheet .pdfbase{pointer-events:none}.settings{display:flex;align-items:center;gap:12px;padding:7px 12px;background:var(--panel);border-top:1px solid var(--line);flex-wrap:wrap}.hint{color:var(--muted);font-size:12px}.laser-setting{display:flex;align-items:center;gap:7px}.laser-setting input{width:72px;background:#101116;border:1px solid var(--line);border-radius:5px;padding:5px}.toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#292c35;padding:9px 14px;border:1px solid var(--line);border-radius:8px;display:none;z-index:5}.page-label{color:var(--muted);min-width:80px;text-align:center}.danger{color:#ff7777}@media(max-width:700px){.top{gap:5px}.top button,.subbar button{padding:7px}.brand{width:100%}.stage{padding:22px 10px}.sheet{width:94vw}.settings{gap:8px}.hint{display:none}}
@media print{body{height:auto;overflow:visible;background:#fff}.top,.subbar,.settings,.toast{display:none!important}.app,.boardarea,.stage{display:block;height:auto;overflow:visible;padding:0;background:#fff}.pages{display:block}.sheet{width:100%;height:100vh;aspect-ratio:auto;box-shadow:none;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">✦ Teaching Board</div>
<button id="undo" title="Undo last mark">↶ Undo</button><button id="clear" class="danger">Clear page</button>
<label>Ink <input id="ink" type="color" value="#172033"></label>
<label>Style <select id="style"><option value="pen">Pen · smooth</option><option value="marker">Marker · broad</option><option value="pencil">Pencil · soft</option><option value="fountain">Fountain · variable</option></select></label>
<label>Size <input id="size" type="range" min="1" max="28" value="4"><span id="sizeText">4 px</span></label>
<div class="spacer"></div><button id="openPdf">Open PDF</button><button id="export">Print / Save PDF</button><input id="pdfFile" type="file" accept="application/pdf,.pdf" hidden>
</header>
<main class="boardarea"><div class="subbar"><button id="prev">‹</button><span class="page-label" id="pageLabel">Page 1 / 1</span><button id="next">›</button><button id="add">＋ New page</button><div class="spacer"></div><label>Board <select id="paper"><option value="lined">Notebook lines</option><option value="blank">Blank · no lines</option><option value="grid">Grid</option><option value="dotted">Dots</option></select></label></div>
<div class="stage" id="stage"><div class="pages" id="pages"></div></div></main>
<footer class="settings"><button id="laser" title="Laser pointer (temporary red ink)">🔴 Laser pointer</button><label class="laser-setting">Laser stays <input id="laserTime" type="number" min="1" max="60" value="3"><span>seconds</span></label><span class="hint">Laser marks fade after the selected time. Select a pen style to write on the board or an opened PDF.</span></footer>
</div><div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), W=850,H=1200;let pages=[newPage('lined')],current=0,style='pen',ink='#172033',size=4,laserMode=false,laserMarks=[],pdfDoc=null;
function newPage(paper='lined',pdfData=null){return{paper,strokes:[],pdfData}}
function toast(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',2300)}
function setPage(){current=Math.max(0,Math.min(current,pages.length-1));render()}
function render(){const root=$('#pages');root.innerHTML='';pages.forEach((p,i)=>{const sheet=document.createElement('div');sheet.className='sheet '+(p.pdfData?'blank':p.paper);sheet.dataset.page=i;
if(p.pdfData){const bg=document.createElement('canvas');bg.className='pdfbase';bg.width=W;bg.height=H;bg.getContext('2d').drawImage(p.pdfData,0,0,W,H);sheet.append(bg)}
const c=document.createElement('canvas');c.width=W;c.height=H;c.className='inkcanvas';sheet.append(c);root.append(sheet);draw(i);attach(c)});
$('#pageLabel').textContent=`Page ${current+1} / ${pages.length}`;$('#paper').value=pages[current].paper;$('#laser').classList.toggle('active',laserMode)}
function draw(i){const c=document.querySelector(`.sheet[data-page="${i}"] .inkcanvas`);if(!c)return;const ctx=c.getContext('2d');ctx.clearRect(0,0,W,H);for(const s of pages[i].strokes)paint(ctx,s);if(i===current)for(const m of laserMarks){if(performance.now()-m.time<laserDuration()){paint(ctx,m.stroke,true)}}}
function laserDuration(){return Math.max(1,Math.min(60,+$('#laserTime').value||3))*1000}
function paint(ctx,s,laser=false){if(!s.points.length)return;ctx.save();ctx.globalCompositeOperation='source-over';ctx.strokeStyle=laser?'#ff263f':s.color;ctx.fillStyle=laser?'#ff263f':s.color;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(s.points[0].x,s.points[0].y);
if(s.style==='marker'&&!laser){ctx.globalAlpha=.42;ctx.lineWidth=s.width*3.2}else if(s.style==='pencil'&&!laser){ctx.globalAlpha=.56;ctx.lineWidth=s.width*.8}else{ctx.globalAlpha=laser?.9:1;ctx.lineWidth=s.width}
for(let n=1;n<s.points.length;n++){const q=s.points[n];if(s.style==='fountain'&&!laser){const prev=s.points[n-1],dist=Math.hypot(q.x-prev.x,q.y-prev.y);ctx.lineWidth=Math.max(.7,s.width*Math.max(.55,Math.min(1.7,dist/4)))}ctx.lineTo(q.x,q.y)}if(s.points.length===1){ctx.arc(s.points[0].x,s.points[0].y,ctx.lineWidth/2,0,Math.PI*2);ctx.fill()}else ctx.stroke();ctx.restore()}
function attach(c){let stroke=null;const point=e=>{const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};c.onpointerdown=e=>{e.preventDefault();c.setPointerCapture(e.pointerId);stroke={color:laserMode?'#ff263f':ink,width:laserMode?Math.max(3,size):size,style:laserMode?'pen':style,points:[point(e)]};if(laserMode){laserMarks.push({stroke,time:performance.now()});draw(current);scheduleLaser()}else{pages[+c.closest('.sheet').dataset.page].strokes.push(stroke);draw(+c.closest('.sheet').dataset.page)}};c.onpointermove=e=>{if(!stroke)return;stroke.points.push(point(e));if(laserMode)draw(current);else draw(+c.closest('.sheet').dataset.page)};c.onpointerup=c.onpointercancel=()=>{stroke=null}}
let laserTimer;function scheduleLaser(){clearInterval(laserTimer);laserTimer=setInterval(()=>{const now=performance.now();laserMarks=laserMarks.filter(m=>now-m.time<laserDuration());draw(current);if(!laserMarks.length){clearInterval(laserTimer);laserTimer=null}},100)}
$('#ink').oninput=e=>ink=e.target.value;$('#style').onchange=e=>style=e.target.value;$('#size').oninput=e=>{$('#sizeText').textContent=e.target.value+' px';size=+e.target.value};$('#paper').onchange=e=>{pages[current].paper=e.target.value;render()};$('#prev').onclick=()=>{current=Math.max(0,current-1);render()};$('#next').onclick=()=>{current=Math.min(pages.length-1,current+1);render()};$('#add').onclick=()=>{pages.splice(current+1,0,newPage($('#paper').value));current++;render()};$('#undo').onclick=()=>{pages[current].strokes.pop();draw(current)};$('#clear').onclick=()=>{pages[current].strokes=[];laserMarks=[];draw(current)};$('#laser').onclick=()=>{laserMode=!laserMode;$('#laser').classList.toggle('active',laserMode);toast(laserMode?'Laser on · temporary red pointer':'Laser off · writing mode')};$('#laserTime').onchange=()=>{const v=Math.max(1,Math.min(60,+$('#laserTime').value||3));$('#laserTime').value=v};$('#export').onclick=()=>window.print();
$('#openPdf').onclick=()=>$('#pdfFile').click();$('#pdfFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(!window.pdfjsLib)throw new Error('PDF reader could not load; check your internet connection.');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const data=new Uint8Array(await file.arrayBuffer());pdfDoc=await pdfjsLib.getDocument({data}).promise;const imported=[];for(let n=1;n<=pdfDoc.numPages;n++){const page=await pdfDoc.getPage(n),base=page.getViewport({scale:1}),scale=Math.min(W/base.width,H/base.height),vp=page.getViewport({scale});const bmp=document.createElement('canvas');bmp.width=W;bmp.height=H;const ctx=bmp.getContext('2d');const x=(W-vp.width)/2,y=(H-vp.height)/2;await page.render({canvasContext:ctx,viewport:vp,transform:[1,0,0,1,x,y]}).promise;imported.push(newPage('blank',bmp))}pages=imported;current=0;render();toast(`Opened ${file.name} · write directly on the pages`)}catch(err){console.error(err);toast('Could not open PDF: '+(err.message||'invalid PDF'))}finally{e.target.value=''}};
render();
})();
</script>
</body>
</html>
