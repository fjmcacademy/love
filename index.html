<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teaching Board</title>
<style>
:root{color-scheme:dark;font:14px/1.4 system-ui,sans-serif;background:#101116;color:#eef0f5}*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column}.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px;background:#1a1b22;border-bottom:1px solid #343640}.bar button,.bar select,.bar label{background:#262832;color:inherit;border:1px solid #444753;border-radius:6px;padding:7px 10px;cursor:pointer}.bar button.active{border-color:#a78bfa;background:#3a3150}.bar input[type=range]{width:120px;accent-color:#a78bfa}.bar input[type=color]{width:32px;height:29px;padding:1px;border:0;background:none}.spacer{flex:1}.board-area{flex:1;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:28px;background:#101116}.sheet{position:relative;width:min(850px,95vw);aspect-ratio:850/1200;background:#fff;box-shadow:0 6px 25px #0009;overflow:hidden;touch-action:none}.sheet.lined{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--gap) - 1px),var(--rule) calc(var(--gap) - 1px),var(--rule) var(--gap))}.sheet.grid{background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);background-size:var(--gap) var(--gap)}.sheet.dotted{background-image:radial-gradient(var(--rule) 1px,transparent 1px);background-size:var(--gap) var(--gap)}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.meta{color:#aab0bf}.color{width:24px;height:24px;border-radius:50%;border:2px solid #777;cursor:pointer}.file{display:none}.notice{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#262832;padding:9px 15px;border-radius:8px;display:none;z-index:5}
</style>
</head>
<body>
<div class="bar"><b>Teaching Board</b><span class="spacer"></span><button id="undo">↶ Undo</button><button id="clear">Clear</button><button id="open">Open photo / PDF</button><input class="file" id="file" type="file" accept="image/*,application/pdf,.pdf"><button id="prev">‹</button><span id="pageLabel">Page 1</span><button id="next">›</button><button id="new">＋ Page</button><select id="paper" aria-label="Board style"><option value="lined">Lined</option><option value="blank">Plain</option><option value="grid">Grid</option><option value="dotted">Dots</option></select></div>
<div class="bar"><span>Tool</span><select id="tool" aria-label="Marker tool"><option>Writing Marker</option><option>Soft Marker</option><option>Writing Pen</option><option>Soft Brush</option><option>Neon Glow</option><option>Eraser</option></select><label>Color <input id="color" type="color" value="#111827"></label><span>Size <b id="sizeValue">5 px</b></span><input id="size" type="range" min="1" max="48" value="5" aria-label="Marker or eraser size"><span id="sizeHint" class="meta">Marker size</span><span class="spacer"></span><span class="meta">Select Plain for a blank board.</span></div>
<main class="board-area"><div id="sheet" class="sheet lined"><canvas id="canvas" width="850" height="1200"></canvas></div></main><div id="notice" class="notice"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),canvas=$('#canvas'),ctx=canvas.getContext('2d'),sheet=$('#sheet');let pages=[{strokes:[],paper:'lined',bg:'#fff',media:null}],current=0,tool='Writing Marker',ink='#111827',size=5,drawing=null,pdfDoc=null,pdfPage=1;function toast(s){const n=$('#notice');n.textContent=s;n.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>n.style.display='none',2400)}function page(){return pages[current]}function render(){const p=page();sheet.className='sheet '+p.paper;sheet.style.backgroundColor=p.bg;sheet.style.setProperty('--gap','30px');sheet.style.setProperty('--rule','#d5deeb');$('#paper').value=p.paper;$('#pageLabel').textContent=`Page ${current+1} / ${pages.length}`;draw()}function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);const p=page();if(p.media){const im=new Image();im.onload=()=>{if(page()===p)ctx.drawImage(im,0,0,canvas.width,canvas.height);drawStrokes(p)};im.src=p.media}else drawStrokes(p)}function drawStrokes(p){for(const s of p.strokes){if(!s.points.length)continue;ctx.save();ctx.globalCompositeOperation=s.tool==='Eraser'?'destination-out':'source-over';ctx.strokeStyle=s.color;ctx.lineWidth=s.width;ctx.lineCap='round';ctx.lineJoin='round';if(s.tool==='Neon Glow'){ctx.shadowColor=s.color;ctx.shadowBlur=s.width*2}if(s.tool==='Soft Brush')ctx.globalAlpha=.65;ctx.beginPath();ctx.moveTo(s.points[0].x,s.points[0].y);for(let i=1;i<s.points.length;i++)ctx.lineTo(s.points[i].x,s.points[i].y);if(s.points.length===1){ctx.lineTo(s.points[0].x+.1,s.points[0].y+.1)}ctx.stroke();ctx.restore()}}function xy(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);drawing={tool,color:ink,width:size,points:[xy(e)]};page().strokes.push(drawing);draw()});canvas.addEventListener('pointermove',e=>{if(!drawing)return;drawing.points.push(xy(e));draw()});for(const ev of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(ev,()=>drawing=null);$('#tool').onchange=e=>{tool=e.target.value;$('#sizeHint').textContent=tool==='Eraser'?'Eraser size':'Marker size'};$('#color').oninput=e=>ink=e.target.value;$('#size').oninput=e=>{size=+e.target.value;$('#sizeValue').textContent=size+' px'};$('#paper').onchange=e=>{page().paper=e.target.value;render()};$('#undo').onclick=()=>{page().strokes.pop();draw()};$('#clear').onclick=()=>{page().strokes=[];page().media=null;draw()};$('#new').onclick=()=>{pages.push({strokes:[],paper:page().paper,bg:page().bg,media:null});current=pages.length-1;render()};$('#prev').onclick=()=>{if(current>0){current--;render()}};$('#next').onclick=()=>{if(current<pages.length-1){current++;render()}};$('#open').onclick=()=>$('#file').click();$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.type.startsWith('image/')){page().media=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});draw();toast('Photo opened on board')}else if(f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf')){if(!window.pdfjsLib)throw new Error('PDF viewer could not load; check your internet connection.');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';pdfDoc=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;pdfPage=1;await addPdfPage();toast(`PDF page 1 of ${pdfDoc.numPages} opened. Use PDF next/previous controls.`)}else throw new Error('Please choose a photo or PDF file.')}catch(err){toast(err.message||'Could not open this file')}finally{e.target.value=''}};async function addPdfPage(){const pg=await pdfDoc.getPage(pdfPage),v=pg.getViewport({scale:1}),scale=Math.min(850/v.width,1200/v.height),viewport=pg.getViewport({scale}),tmp=document.createElement('canvas');tmp.width=Math.round(viewport.width);tmp.height=Math.round(viewport.height);await pg.render({canvasContext:tmp.getContext('2d'),viewport}).promise;page().media=tmp.toDataURL('image/png');draw();toast(`PDF page ${pdfPage} of ${pdfDoc.numPages}`)}const pdfControls=document.createElement('span');pdfControls.innerHTML='<button id="pdfPrev" title="Previous PDF page">PDF ‹</button><button id="pdfNext" title="Next PDF page">PDF ›</button>';document.querySelector('.bar').append(pdfControls);$('#pdfPrev').onclick=async()=>{if(pdfDoc&&pdfPage>1){pdfPage--;await addPdfPage()}};$('#pdfNext').onclick=async()=>{if(pdfDoc&&pdfPage<pdfDoc.numPages){pdfPage++;await addPdfPage()}};render()})();
</script>
</body>
</html>
